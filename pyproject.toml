[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hot-coin-radar"
version = "0.1.0"
description = "Multi-source hot token discovery and observation radar"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "PyYAML>=6,<7",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1"]

[project.scripts]
radar = "radar.cli:main"

[tool.setuptools]
packages = ["radar"]

[tool.setuptools.package-data]
radar = ["static/*", "static/icons/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
